name: Hourly Data Fix

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run collector
        run: python ml_data_collector.py

      - name: Save to Repo
        run: |
          git config --global user.name "DataBot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "Hourly Data Update" || echo "No changes to commit"
          git push
