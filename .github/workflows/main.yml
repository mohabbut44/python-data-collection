name: Hourly Data Collection

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর রান করবে
    - cron: '0 * * * *'
  # যেকোনো সময় ম্যানুয়ালি রান করার অপশন
  workflow_dispatch: 

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    # গিটহাবে নতুন ডেটা পুশ (Push) করার পারমিশন
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Push এরর এড়াতে সম্পূর্ণ হিস্ট্রি ফেচ করবে

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # pip ক্যাশ অন করা হলো, যাতে প্রতিবার রান হতে কম সময় লাগে

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Script
        env:
          WEATHER_CHANNEL_API_KEY: ${{ secrets.WEATHER_CHANNEL_API_KEY }}
          AMBEE_API_KEY: ${{ secrets.AMBEE_API_KEY }}
        run: python ml_data_collector.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add app_vs_standard_ml_data.csv
          
          # যদি ডেটায় কোনো চেঞ্জ না থাকে, তবে গিটহাব এরর না দিয়ে পরের স্টেপে যাবে
          git commit -m "🤖 Auto-update hourly data (CSV)" || echo "No changes to commit"
          
          # পুশ করার আগে লেটেস্ট আপডেট সিঙ্ক করে নেবে, যাতে কনফ্লিক্ট না হয়
          git pull --rebase || echo "No rebase needed"
          
          git push
