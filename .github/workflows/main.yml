name: Hourly Data Collection

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python Script
        env:
          WEATHER_CHANNEL_API_KEY: ${{ secrets.WEATHER_CHANNEL_API_KEY }}
          AMBEE_API_KEY: ${{ secrets.AMBEE_API_KEY }}
        run: python ml_data_collector.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add app_vs_standard_ml_data.csv
          git commit -m "🤖 Auto-update hourly data (CSV)" || echo "No changes to commit"
          git push
